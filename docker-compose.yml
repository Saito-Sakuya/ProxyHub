version: '3.8'

services:
  proxyhub:
    build: .
    container_name: proxyhub-service
    restart: always
    ports:
      - "127.0.0.1:8000:8000"       # Web Dashboard (localhost only via SSH tunnel)
      - "1080:1080"                  # Smart Proxy Gateway (SOCKS5 + HTTP auto-detect)
    volumes:
      - ./config.json:/app/config.json
      - ./bin:/app/bin
    environment:
      - TZ=Asia/Shanghai
